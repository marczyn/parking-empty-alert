name: Build VM images (OVA)

on:
  # OVAs/qcow2 are NOT published as GitHub release assets (each is 4.6-11 GB, over the
  # 2 GiB release-asset limit). Distribution is via the GHCR images; appliance images are
  # built on demand. So this runs manually only — a release no longer triggers a build.
  # Since 2026-10-19 the images are NOT stored as Actions artifacts either (owner: „zrezygnuj z artefaktów dla tego
  # projektu i zwolnij miejsce … nie potrzebujemy tych artefaktów”): four ~5 GB uploads per run were the largest item of
  # the GitHub Actions storage bill that exhausted the October budget. The run now only proves the images build.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.2)'
        required: true
        default: 'dev'

permissions:
  contents: read   # checkout only; nothing is uploaded

env:
  # Consumed in-shell as "$VERSION" inside each "Resolve version" step (never ${{ }}
  # template-expanded into a command line). The 'v' prefix is stripped there with ${V#v}.
  VERSION: ${{ github.event.inputs.version || 'dev' }}

jobs:

  check-runner:
    name: Verify KVM available
    runs-on: ubuntu-latest   # GitHub-hosted since 2026-10-16 (owner); the `parking` self-hosted runner no longer exists
    outputs:
      kvm: ${{ steps.kvm.outputs.available }}
    steps:
      - name: Check /dev/kvm
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM available — builds will use hardware acceleration"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: /dev/kvm not found — builds will use TCG (slow)"
          fi

  build-full:
    name: Build full OVA
    needs: check-runner
    runs-on: ubuntu-latest   # GitHub-hosted since 2026-10-16 (owner); the `parking` self-hosted runner no longer exists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub-hosted runner (2026-10-16): ~14 GB free on / is less than a full build needs (OVA up to
      # ~11 GB plus the qcow2 it is made from), so the preinstalled SDKs we do not use are dropped first.
      - name: Free disk space (hosted runner)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          docker-images: true
          swap-storage: false
      # Hosted Linux runners expose /dev/kvm, but only root may open it until this udev rule is added;
      # without it Packer falls back to TCG (software emulation, many times slower).
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          df -h / | tail -1

      - name: Resolve version
        id: version
        run: |
          V="$VERSION"   # consume the env var in-shell; never template-expand untrusted input into the command
          # Strip leading 'v' if present
          V="${V#v}"
          # Allowlist: only version-safe chars, so the value can never carry shell metacharacters
          case "$V" in
            ''|*[!A-Za-z0-9._-]*) echo "::error::invalid version '$V' (allowed: A-Za-z0-9 . _ -)"; exit 1 ;;
          esac
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Cache Debian cloud image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.packer-cache
          key: debian-12-genericcloud-amd64-latest
          restore-keys: debian-12-genericcloud-amd64-

      - name: Install Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3 (release line, pinned to SHA)
        with:
          version: "1.11.2"               # pin Packer (was 'latest')

      - name: Install QEMU and deps
        run: |
          pkgs=""
          command -v qemu-system-x86_64 &>/dev/null || pkgs="$pkgs qemu-system-x86 qemu-utils"
          command -v xorriso &>/dev/null          || pkgs="$pkgs xorriso"
          if [ -n "$pkgs" ]; then sudo apt-get install -y $pkgs; fi

      - name: Packer init
        working-directory: vm
        run: packer init parking.pkr.hcl

      - name: Build full OVA
        working-directory: ${{ github.workspace }}
        env:
          PACKER_CACHE_DIR: ~/.packer-cache
          PACKER_LOG: 1
          # Consume the resolved version as a shell var — never ${{ }} template-expand it
          # into the command line (command-injection sink). Already allowlist-validated above.
          VER: ${{ steps.version.outputs.version }}
        run: |
          # Retry: packer fetches the Debian checksum/image from the pinned acc.umu.se
          # mirror (see vm/parking.pkr.hcl); retry guards against transient TLS/network blips.
          for attempt in 1 2 3 4 5; do
            echo "::group::packer build full (attempt $attempt)"
            if packer build -var "variant=full" -var "version=$VER" vm/parking.pkr.hcl; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed (often the flaky Debian mirror) — retrying..."
            sleep 15
          done
          echo "::error::packer build (full) failed after 5 attempts"; exit 1

  build-lite:
    name: Build lite OVA
    needs: check-runner
    runs-on: ubuntu-latest   # GitHub-hosted since 2026-10-16 (owner); the `parking` self-hosted runner no longer exists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub-hosted runner (2026-10-16): ~14 GB free on / is less than a full build needs (OVA up to
      # ~11 GB plus the qcow2 it is made from), so the preinstalled SDKs we do not use are dropped first.
      - name: Free disk space (hosted runner)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          docker-images: true
          swap-storage: false
      # Hosted Linux runners expose /dev/kvm, but only root may open it until this udev rule is added;
      # without it Packer falls back to TCG (software emulation, many times slower).
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          df -h / | tail -1

      - name: Resolve version
        id: version
        run: |
          V="$VERSION"   # consume the env var in-shell; never template-expand untrusted input into the command
          V="${V#v}"
          case "$V" in
            ''|*[!A-Za-z0-9._-]*) echo "::error::invalid version '$V' (allowed: A-Za-z0-9 . _ -)"; exit 1 ;;
          esac
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Cache Debian cloud image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.packer-cache
          key: debian-12-genericcloud-amd64-latest
          restore-keys: debian-12-genericcloud-amd64-

      - name: Install Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3 (release line, pinned to SHA)
        with:
          version: "1.11.2"               # pin Packer (was 'latest')

      - name: Install QEMU and deps
        run: |
          pkgs=""
          command -v qemu-system-x86_64 &>/dev/null || pkgs="$pkgs qemu-system-x86 qemu-utils"
          command -v xorriso &>/dev/null          || pkgs="$pkgs xorriso"
          if [ -n "$pkgs" ]; then sudo apt-get install -y $pkgs; fi

      - name: Packer init
        working-directory: vm
        run: packer init parking.pkr.hcl

      - name: Build lite OVA
        working-directory: ${{ github.workspace }}
        env:
          PACKER_CACHE_DIR: ~/.packer-cache
          PACKER_LOG: 1
          # Consume the resolved version as a shell var — never ${{ }} template-expand it
          # into the command line (command-injection sink). Already allowlist-validated above.
          VER: ${{ steps.version.outputs.version }}
        run: |
          # Retry: packer fetches the Debian checksum/image from the pinned acc.umu.se
          # mirror (see vm/parking.pkr.hcl); retry guards against transient TLS/network blips.
          for attempt in 1 2 3 4 5; do
            echo "::group::packer build lite (attempt $attempt)"
            if packer build -var "variant=lite" -var "version=$VER" vm/parking.pkr.hcl; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed (often the flaky Debian mirror) — retrying..."
            sleep 15
          done
          echo "::error::packer build (lite) failed after 5 attempts"; exit 1

